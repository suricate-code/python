{% load bootstrap5 %}
<!DOCTYPE html>
<html>
<head>
    <title>Editar Cliente</title>
    {% bootstrap_css %}
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-warning">
            <h4>✏ Editar Cliente</h4>
        </div>
        <div class="card-body">

            <form method="post">
                {% csrf_token %}

                <div class="mb-3">
                    <label>Nome</label>
                    <input type="text" name="nome" 
                           class="form-control" 
                           value="{{ cliente.nome }}">
                </div>

                <div class="mb-3">
                    <label>Sobrenome</label>
                    <input type="text" name="sobrenome" 
                           class="form-control" 
                           value="{{ cliente.sobrenome }}">
                </div>

                <div class="mb-3">
                    <label>Data de Nascimento</label>
                    <input type="date" name="data_nascimento" 
                           class="form-control" 
                           value="{{ cliente.data_nascimento|date:'Y-m-d' }}">
                </div>

                <div class="mb-3">
                    <label>CPF</label>
                    <input type="text" name="cpf" 
                           class="form-control" 
                           value="{{ cliente.cpf }}">
                </div>

                <div class="mb-3">
                    <label>Telefone</label>
                    <input type="text" name="telefone" 
                           class="form-control" 
                           value="{{ cliente.telefone }}">
                </div>

                <div class="mb-3">
                    <label>Email</label>
                    <input type="email" name="email" 
                           class="form-control" 
                           value="{{ cliente.email }}">
                </div>

                <button type="submit" class="btn btn-success">
                    💾 Salvar Alterações
                </button>

                <a href="{% url 'urlclientes' %}" 
                   class="btn btn-secondary">
                    Cancelar
                </a>

            </form>

        </div>
    </div>
</div>

{% bootstrap_javascript %}
</body>
</html>
