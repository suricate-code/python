{% load bootstrap5 %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Clientes</title>
    {% bootstrap_css %}
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="card shadow-lg">
        <div class="card-header bg-success text-white">
            <h3 class="mb-0">📝 Cadastro de Clientes</h3>
        </div>

        <div class="card-body">

            <form action="{% url 'urlsalvaClientes' %}" method="POST">
                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" name="nome" class="form-control" placeholder="Digite seu Nome">
                </div>

                <div class="mb-3">
                    <label class="form-label">Sobrenome</label>
                    <input type="text" name="sobrenome" class="form-control" placeholder="Digite seu Sobrenome">
                </div>

                <div class="mb-3">
                    <label class="form-label">E-mail</label>
                    <input type="email" name="email" class="form-control" placeholder="Digite seu E-mail">
                </div>

                <div class="mb-3">
                    <label class="form-label">CPF</label>
                    <input type="text" name="cpf" class="form-control" placeholder="Digite seu CPF">
                </div>

                <div class="mb-3">
                    <label class="form-label">Telefone</label>
                    <input type="text" name="telefone" class="form-control" placeholder="Digite seu Telefone">
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-success btn-lg">
                        💾 Salvar Cliente
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

{% bootstrap_javascript %}
</body>
</html>
